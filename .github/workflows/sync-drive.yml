name: Sync Google Drive photos

on:
  schedule:
    # GitHub 繁忙時會延遲；改每 10 分鐘較穩
    - cron: "*/10 * * * *"
  workflow_dispatch:
  # 推送程式碼時也順便同步一次，避免只有排程卻遲遲不跑
  push:
    branches: [main]
    paths-ignore:
      - "data.json"
      - "README.md"
      - "DEPLOY.md"
      - "CURSOR_PROMPT.md"

permissions:
  contents: write

concurrency:
  group: sync-drive
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 讓 bot 之後能 push
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync Drive folder → data.json
        id: sync
        run: |
          set -euo pipefail
          python3 sync_drive_to_data.py | tee sync.log
          if grep -q 'CHANGED=true' sync.log; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push if changed
        if: steps.sync.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then
            echo "No staged changes"
            exit 0
          fi
          git commit -m "chore: sync Google Drive album ($(date -u +%Y-%m-%dT%H:%MZ))"
          git push
