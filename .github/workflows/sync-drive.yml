name: Sync Google Drive photos

on:
  schedule:
    # 每 5 分鐘（GitHub 繁忙時可能略延遲）
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-drive
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync Drive folder → data.json
        id: sync
        run: |
          set -euo pipefail
          python3 sync_drive_to_data.py | tee sync.log
          if grep -q 'CHANGED=true' sync.log; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push if changed
        if: steps.sync.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then
            echo "No staged changes"
            exit 0
          fi
          git commit -m "chore: sync Google Drive album ($(date -u +%Y-%m-%dT%H:%MZ))"
          git push
