name: Sync Google Drive photos

# 流程：硬碟上傳 → 本 Action 定時抓取 → OCR 補號碼 → 推送 → GitHub Pages 自動更新
on:
  schedule:
    # 每 5 分鐘（GitHub 忙碌時可能延遲到十幾分鐘）
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "data.json"
      - "bibs_lock.json"
      - "README.md"
      - "DEPLOY.md"
      - "CURSOR_PROMPT.md"

permissions:
  contents: write

concurrency:
  group: sync-drive
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Tesseract OCR
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr

      - name: Sync Drive folder → data.json
        id: sync
        run: |
          set -euo pipefail
          python3 sync_drive_to_data.py | tee sync.log
          if grep -q 'CHANGED=true' sync.log; then
            echo "sync_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "sync_changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: OCR photos missing bib numbers
        id: ocr
        run: |
          set -euo pipefail
          python3 ocr_missing_bibs.py --limit 30 | tee ocr.log
          if grep -q 'CHANGED=true' ocr.log; then
            echo "ocr_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "ocr_changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push if changed
        if: steps.sync.outputs.sync_changed == 'true' || steps.ocr.outputs.ocr_changed == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json bibs_lock.json
          if git diff --cached --quiet; then
            echo "No staged changes"
            exit 0
          fi
          git commit -m "chore: auto-sync Drive album ($(date -u +%Y-%m-%dT%H:%MZ))"
          git push
